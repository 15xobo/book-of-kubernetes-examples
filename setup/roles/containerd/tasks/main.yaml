---
- name: prerequisites
  ansible.builtin.apt:
    name: apt-transport-https
    update_cache: yes

- name: gpg key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: repository
  ansible.builtin.apt_repository:
    repo: deb https://download.docker.com/linux/ubuntu jammy stable
    state: present
    filename: docker

- name: install
  ansible.builtin.apt:
    name: containerd.io
    update_cache: yes

- name: init containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: containerd_cri
  notify:
    - restart containerd

- name: enable cri
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^disabled_plugins'
    line: "disabled_plugins = []"
  when: containerd_cri
  notify:
    - restart containerd
    
- name: enable cri
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)sandbox_image'
    line: '    sandbox_image = "registry.k8s.io/pause:3.10"'
  when: containerd_cri
  notify:
    - restart containerd

- name: enable cri
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup'
    line: '            SystemdCgroup = true'
  when: containerd_cri
  notify:
    - restart containerd
  
- meta: flush_handlers
